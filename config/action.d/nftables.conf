# nftables action with separate IPv4 and IPv6 sets, one table per jail.
# Requires CAP_NET_ADMIN (run as root or grant the capability to the service).
[Definition]
actionstart = nft list table inet autoban-<name> >/dev/null 2>&1 || nft add table inet autoban-<name>
              nft list set inet autoban-<name> banned4 >/dev/null 2>&1 || nft add set inet autoban-<name> banned4 '{ type ipv4_addr; }'
              nft list set inet autoban-<name> banned6 >/dev/null 2>&1 || nft add set inet autoban-<name> banned6 '{ type ipv6_addr; }'
              nft list chain inet autoban-<name> input >/dev/null 2>&1 || nft add chain inet autoban-<name> input '{ type filter hook input priority filter; policy accept; }'
              nft list chain inet autoban-<name> input | grep -q 'ip saddr @banned4' || nft add rule inet autoban-<name> input ip saddr @banned4 drop
              nft list chain inet autoban-<name> input | grep -q 'ip6 saddr @banned6' || nft add rule inet autoban-<name> input ip6 saddr @banned6 drop
actionstop = nft delete table inet autoban-<name> 2>/dev/null || true
actioncheck = command -v nft >/dev/null 2>&1
actionban = if [ "<family>" = "inet6" ]; then nft add element inet autoban-<name> banned6 { <ip> }; else nft add element inet autoban-<name> banned4 { <ip> }; fi
actionunban = if [ "<family>" = "inet6" ]; then nft delete element inet autoban-<name> banned6 { <ip> }; else nft delete element inet autoban-<name> banned4 { <ip> }; fi
actionflush = nft flush set inet autoban-<name> banned4 2>/dev/null || true
              nft flush set inet autoban-<name> banned6 2>/dev/null || true

[Init]
name = default
