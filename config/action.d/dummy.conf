# Demo action: records lifecycle events in a file. It requires no root
# privileges and is useful for tests and for trying gojail.
[Definition]
actionstart = printf '%s\n' "start jail=<name>" >> "<logpath>"
actionstop = printf '%s\n' "stop jail=<name>" >> "<logpath>"
actioncheck =
actionban = printf '%s\n' "ban ip=<ip> family=<family> jail=<name> failures=<failures> bantime=<bantime> count=<bancount>" >> "<logpath>"
actionunban = printf '%s\n' "unban ip=<ip> family=<family> jail=<name>" >> "<logpath>"
actionflush = printf '%s\n' "flush jail=<name>" >> "<logpath>"

[Init]
name = default
logpath = /tmp/gojail/actions.log
