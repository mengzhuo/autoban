# gojail daemon configuration (demo paths).
# For a production installation use /run and /var/lib; see README.
[DEFAULT]
loglevel = INFO
logtarget = /tmp/gojail/gojail.log

# Control socket used by gj.
socket = /tmp/gojail/gojail.sock
socketmode = 0660
pidfile = /tmp/gojail/gojail.pid

# JSON snapshot database. Set dbfile = to disable persistence.
dbfile = /tmp/gojail/gojail.db
dbpurgeage = 1d

# Default polling interval for the file backend.
pollinterval = 1s

