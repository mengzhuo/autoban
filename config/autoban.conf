# autoban daemon configuration (demo paths).
# For a production installation use /run and /var/lib; see README.
[DEFAULT]
loglevel = INFO
logtarget = /tmp/autoban/autoban.log

# Control socket used by autoban-ctl.
socket = /tmp/autoban/autoban.sock
socketmode = 0660
pidfile = /tmp/autoban/autoban.pid

# JSON snapshot database. Set dbfile = to disable persistence.
dbfile = /tmp/autoban/autoban.db
dbpurgeage = 1d

# Default polling interval for the file backend.
pollinterval = 1s

