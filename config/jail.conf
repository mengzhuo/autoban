# Base jail configuration. jail.local enables and overrides individual jails.
[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
maxretry = 5
findtime = 10m
bantime = 10m
backend = auto
usedns = warn
maxlines = 1

# Use the dummy action for the demo. Change banaction to iptables-multiport,
# nftables or ufw on a real system.
banaction = dummy
action_ = %(banaction)s[name=%(__name__)s]
action = %(action_)s

# Include every *.local file from the filter/action directories automatically
# through their normal lookup; no explicit include is required.

[sshd]
enabled = false
port = ssh
protocol = tcp
filter = sshd
logpath = /var/log/auth.log

[nginx-http-auth]
enabled = false
port = http,https
filter = nginx-http-auth
logpath = /var/log/nginx/error.log

[apache-auth]
enabled = false
port = http,https
filter = apache-auth
# Debian/Ubuntu path; RHEL uses /var/log/httpd/error_log
logpath = /var/log/apache2/error.log

[caddy]
enabled = false
port = http,https
filter = caddy-auth
# Requires Caddy access logging to this file.
logpath = /var/log/caddy/access.log

[wordpress]
enabled = false
port = http,https
filter = wordpress
# Requires Caddy access logging to this file.
logpath = /var/log/caddy/access.log
