# Froxlor login failures (classic syslog and systemd JSON formats).
[Definition]
failregex = ^.*Froxlor: \[Login Action <HOST>\] (?:Unknown )?[uU]ser(?: '.*')? tried to login(?: with wrong password)?\.\s*$
            ^.*froxlor\.WARNING: (?:Unknown )?[uU]ser(?: '.*')? tried to login(?: with wrong password)?\. \{(?:"[^"]+":"[^"]*",\s*){0,5}"user":"<HOST>"\} \[\]\s*$
ignoreregex =
