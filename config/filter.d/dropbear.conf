# Dropbear SSH authentication failures.
# Formats matched against fail2ban's dropbear filter/test corpus.
[Definition]
failregex = (?i)^.*login attempt for nonexistent user (?:'[^']*' )?from <HOST>:\d+$
            (?i)^.*bad (?:pam )?password attempt for '[^']+' from <HOST>(?::\d+)?$
            (?i)^.*exit before auth \(user '[^']+', \d+ fails\): max auth tries reached - user '[^']+' from <HOST>:\d+\s*$
ignoreregex =
