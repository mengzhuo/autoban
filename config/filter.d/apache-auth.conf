# Apache 2.4 and 2.2 HTTP authentication/authorization failures.
[Definition]
failregex = ^.*\[(?:[\w]*:)?error\] \[pid \d+(?::tid \d+)?\] \[(?:client|remote) \[?<HOST>\]?(?::\d+)?\] AH\d+: (?:user .* (?:authentication failure|not found|authorization failure)|client (?:denied by server configuration|used wrong authentication scheme)|Authorization of user .* failed|.*password mismatch|invalid (?:nonce|qop)|realm mismatch|unknown algorithm).*$
            ^\[[^\]]+\] \[error\] \[client \[?<HOST>\]?\] (?:user .* (?:authentication failure|not found|authorization failure)|client used wrong authentication scheme|Authorization of user .* failed).*$
ignoreregex =

# Apache 2.4 default error log; second branch covers Apache 2.2 (no fraction).
datepattern = {^LN-BEG}[%a %b %d %H:%M:%S.%f %Y]|{^LN-BEG}[%a %b %d %H:%M:%S %Y]
