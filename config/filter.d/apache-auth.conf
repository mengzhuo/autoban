# Apache 2.4 and 2.2 HTTP basic-auth failures from the error log.
# The 2.4 format includes the module, pid:tid and client port; the 2.2 format
# only includes [error] and the client address.
[Definition]
failregex = ^\[[^\]]+\] \[auth_basic:error\] \[pid \d+:tid \d+\] \[client <HOST>:\d+\] AH01617: user .*: authentication failure for .*$
            ^\[[^\]]+\] \[auth_basic:error\] \[pid \d+:tid \d+\] \[client <HOST>:\d+\] AH01618: user .* not found: .*$
            ^\[[^\]]+\] \[error\] \[client <HOST>\] user .*: authentication failure for .*$
            ^\[[^\]]+\] \[error\] \[client <HOST>\] user .* not found: .*$
ignoreregex =

# Apache 2.4 default error log: [Wed Oct 11 14:32:52.123456 2023]
# The fractional seconds are optional, covering the 2.2 default as well.
datepattern = {^LN-BEG}[%a %b %d %H:%M:%S.%f %Y]|{^LN-BEG}[%a %b %d %H:%M:%S %Y]
