# lighttpd HTTP auth failures (auth and mod_auth).
[Definition]
failregex = ^.*(?:http|mod)_auth\.c\.\d+\) (?:password doesn't match for (?:\S+|.*?) username:\s*\S+\s*|digest: auth failed(?: for\s+\S+\s*)?: (?:wrong password|uri mismatch \([^)]*\))|get_password failed),? IP: <HOST>\s*$
ignoreregex =
