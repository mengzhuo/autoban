# WordPress login and XML-RPC abuse in Caddy JSON access logs.
#
# Successful wp-login.php logins normally redirect (302); failed logins stay
# on the login page (200). XML-RPC authentication failures also return 200,
# so POSTs to xmlrpc.php are treated as failures when they reach the limit.
# Enable Caddy access logging to /var/log/caddy/access.log.
[Definition]
failregex = ^.*"logger":"http\.log\.access[^"]*".*"remote_ip":"<HOST>".*"method":"POST".*"uri":"/wp-login\.php[^"]*".*"status":(?:200|401|403|429).*$
            ^.*"logger":"http\.log\.access[^"]*".*"remote_ip":"<HOST>".*"method":"POST".*"uri":"/xmlrpc\.php[^"]*".*"status":(?:200|401|403|429).*$
ignoreregex =
