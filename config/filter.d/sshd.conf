# OpenSSH authentication failures.
# The Go filter engine uses RE2-compatible regexes and expands <HOST> into
# IPv4, IPv6 and (depending on usedns) hostname alternatives.
[Definition]
failregex = ^.*Failed (?:password|publickey|keyboard-interactive/pam|none) for (?:invalid user )?\S+ from <HOST> port \d+(?: ssh2)?\s*$
            ^.*Invalid user \S+ from <HOST>(?: port \d+)?\s*$
            ^.*Connection closed by (?:authenticating user \S+|invalid user \S+) <HOST> port \d+(?: \[preauth\])?\s*$
            ^.*Disconnecting (?:authenticating|invalid) user \S+ <HOST> port \d+(?: \[preauth\])?\s*$
            ^.*Disconnected from (?:authenticating|invalid) user \S+ <HOST> port \d+(?: \[preauth\])?\s*$
            ^.*pam_unix\(sshd:auth\): authentication failure;.*rhost=<HOST>(?:\s|$).*$
            ^.*PAM \d+ more authentication failures;.*rhost=<HOST>(?:\s|$).*$
            ^.*error: maximum authentication attempts exceeded for .* from <HOST> port \d+.*$
ignoreregex =

# Timestamps are auto-detected (syslog, ISO-8601, nginx, Apache and epoch).
# A fail2ban datepattern can be set here for unusual formats:
# datepattern = {^LN-BEG}%Y-%m-%dT%H:%M:%S
