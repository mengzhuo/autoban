            ^.*(?:dovecot(?:-auth)?|auth(?:-worker)?)(?:\([^)]*\))?(?:\[\d+\])?: [\w-]+-login: (?:Login aborted|Aborted login|Disconnected|Remote closed connection|Client has quit the connection).*\(auth failed.*\).*rip=<HOST>,.*$
            ^.*(?:dovecot(?:-auth)?|auth(?:-worker)?)(?:\([^)]*\))?(?:\[\d+\])?: [\w-]+-login: Aborted login \(tried to use (?:disabled|disallowed) \S+ auth\):.*rip=<HOST>,.*$
            ^.*(?:dovecot(?:-auth)?|auth(?:-worker)?)(?:\([^)]*\))?(?:\[\d+\])?: (?:[\w-]+\([^)]*\): )?(?:Info: )?(?:pam|passwd-file)\([^,]+,<HOST>\): (?:pam_authenticate\(\) failed:.*|unknown user).*$
