# Postfix SMTP authentication failures and rejected messages.
[Definition]
failregex = ^.*postfix[^\[\s]*/smtpd\[\d+\]: warning: [^[]*\[<HOST>\](?::\d+)?: SASL .* authentication failed:.*$
            ^.*postfix[^\[\s]*/smtpd\[\d+\]: NOQUEUE: reject: .* from [^[]*\[<HOST>\](?::\d+)?: [45]\d\d [45]\.\d\.\d+ .*$
ignoreregex =
