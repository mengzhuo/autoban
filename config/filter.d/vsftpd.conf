# vsftpd PAM authentication failures and FAIL LOGIN entries.
[Definition]
failregex = ^.*vsftpd(?:\(pam_unix\))?(?:\[\d+\])?: (?:\(pam_unix\) |pam_unix\([^)]+\): )?authentication failure;.*rhost=<HOST>.*$
            ^.*\[pid \d+\] \[.*\] FAIL LOGIN: Client "<HOST>".*$
            ^.*vsftpd\[\d+\]: \[.*\] FAIL LOGIN: Client "<HOST>".*$
ignoreregex =
