# Caddy JSON access logs with HTTP 401 responses (basic-auth failures).
# Caddy's default structured logger records "logger":"http.log.access",
# "request":{"remote_ip":"..."} and the final "status".
# Enable access logging in the Caddyfile, for example:
#   log { output file /var/log/caddy/access.log }
[Definition]
failregex = ^.*"logger":"http\.log\.access[^"]*".*"remote_ip":"<HOST>".*"status":401.*$
            ^.*"logger":"http\.log\.access[^"]*".*"status":401.*"remote_ip":"<HOST>".*$
ignoreregex =
