# OpenVPN TLS/auth failures, including the upstream SIGUSR1 reset cases.
[Definition]
failregex = ^.*(?:openvpn|ovpn-server\d*)\[\d+\]: <HOST>:\d+ (?:TLS Auth Error:|VERIFY ERROR:|TLS Error: TLS handshake failed\b|SIGUSR1\[soft,connection-reset\] received\b).*$
            ^.*(?:openvpn|ovpn-server\d*)\[\d+\]: <HOST>:\d+ TLS: Username/Password authentication failed for username .*$
            ^.*(?:openvpn|ovpn-server\d*)\[\d+\]: TLS Error: cannot locate HMAC in incoming packet from \[AF_INET\]\s*<HOST>:\d+.*$
ignoreregex =
