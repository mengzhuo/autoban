# Apache access logs with known bad crawler/email-harvester user agents.
[Definition]
badbots = (?:TrackBack/1\.02|EmailSiphon|EmailSpider|EmailWolf|ExtractorPro|WebVulnCrawl|Wells Search|LetsCrawl|Nsauditor|AutoEmailSpider|Indy Library)
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[^"]+" \d+ \d+ "[^"]*" "[^"]*(?:%(badbots)s).*"$
ignoreregex =
