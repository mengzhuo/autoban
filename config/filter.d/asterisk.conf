failregex = ^\[[^\]]+\] (?:NOTICE|SECURITY|WARNING)\[\d+\]:? chan_sip\.c:\d*:? Registration from '[^']*' failed for '<HOST>(?::\d+)?' - (?:Wrong password|Username/auth name mismatch|No matching peer found|Not a local domain|Device does not match ACL|Peer is not supposed to register|ACL error \(permit/deny\))$
ignoreregex =
