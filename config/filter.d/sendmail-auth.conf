# Sendmail AUTH brute-force warnings and AUTH failures.
[Definition]
failregex = ^.*(?:sendmail|sm-mta|sm-acceptingconnections)\[\d+\]: .*\[<HOST>\](?: \(may be forged\))?: possible SMTP attack: command=AUTH, count=\d+$
            ^.*(?:sendmail|sm-mta|sm-acceptingconnections)\[\d+\]: .*AUTH failure .*relay=(?:\S+ )?\[<HOST>\].*$
ignoreregex =
