# nginx HTTP basic-auth failures (error and crit levels).
[Definition]
failregex = ^.*\[(?:error|crit)\] \d+#\d+: \*\d+ user "(?:[^"]+|.*?)":? (?:password mismatch|was not found in "[^"]*"), client: <HOST>, .*$
            ^.*\[(?:error|crit)\] \d+#\d+: \*\d+ (?:PAM: )?user '[^']+' - not authenticated: Authentication failure, client: <HOST>, .*$
ignoreregex =
