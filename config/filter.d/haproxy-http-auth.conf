# HAProxy access logs with HTTP 401 responses.
# Supports both raw HAProxy logs and syslog-prefixed logs.
[Definition]
failregex = ^<HOST>:\d+ \[[^\]]+\] \S+ \S+ \d+/\d+/\d+/\d+/\d+ 401 \d+ .*$
            ^.*haproxy\[\d+\]: <HOST>:\d+ \[[^\]]+\] \S+ \S+ \d+/\d+/\d+/\d+/\d+ 401 \d+ .*$
ignoreregex =
