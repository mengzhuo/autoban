# Roundcube login failures (errors.log and syslog IMAP errors).
[Definition]
failregex = ^\[[^\]]+\]: (?:FAILED|Failed) login for .* from <HOST>(?:[.\s]|$).*$
            ^.*roundcube.*: IMAP Error: Login failed for .* from <HOST>(?:[.\s]|$).*$
ignoreregex =
datepattern = {^LN-BEG}[%d-%b-%Y %H:%M:%S %z]
